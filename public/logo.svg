<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none">
  <defs>
    <linearGradient id="gv-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="55%" stop-color="#1E5AAF"/>
      <stop offset="100%" stop-color="#0A4F6B"/>
    </linearGradient>
    <linearGradient id="gv-text-grad" x1="96" y1="10" x2="120" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#1E5AAF"/>
    </linearGradient>
  </defs>

  <!-- Icon background pill -->
  <rect width="40" height="40" rx="10" fill="url(#gv-grad)"/>

  <!-- QR corner: top-left -->
  <rect x="6" y="6" width="11" height="11" rx="2.5" fill="white" opacity="0.95"/>
  <rect x="8.5" y="8.5" width="6" height="6" rx="1.5" fill="url(#gv-grad)"/>

  <!-- QR corner: top-right -->
  <rect x="23" y="6" width="11" height="11" rx="2.5" fill="white" opacity="0.95"/>
  <rect x="25.5" y="8.5" width="6" height="6" rx="1.5" fill="url(#gv-grad)"/>

  <!-- QR corner: bottom-left -->
  <rect x="6" y="23" width="11" height="11" rx="2.5" fill="white" opacity="0.95"/>
  <rect x="8.5" y="25.5" width="6" height="6" rx="1.5" fill="url(#gv-grad)"/>

  <!-- Camera aperture: bottom-right quadrant -->
  <circle cx="28.5" cy="28.5" r="6.5" fill="white" opacity="0.92"/>
  <circle cx="28.5" cy="28.5" r="4.5" fill="url(#gv-grad)"/>
  <circle cx="28.5" cy="28.5" r="2.1" fill="white"/>
  <circle cx="27.3" cy="27.3" r="0.6" fill="white" opacity="0.8"/>

  <!-- QR data cells in middle zone -->
  <rect x="19" y="19" width="2.5" height="2.5" rx="0.7" fill="white" opacity="0.75"/>
  <rect x="18" y="23.5" width="2" height="2" rx="0.5" fill="white" opacity="0.5"/>
  <rect x="22.5" y="19" width="2" height="2" rx="0.5" fill="white" opacity="0.5"/>

  <!-- Wordmark -->
  <text x="49" y="25" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,sans-serif" font-weight="800" font-size="15.5" letter-spacing="-0.4" fill="#0A4F6B">Guest</text>
  <text x="97" y="25" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,sans-serif" font-weight="800" font-size="15.5" letter-spacing="-0.4" fill="url(#gv-text-grad)">Vue</text>

  <!-- Tagline -->
  <text x="49" y="34.5" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,sans-serif" font-weight="500" font-size="6" letter-spacing="1" fill="#14B8A6">EVERY MOMENT. ONE QR CODE.</text>
</svg>
